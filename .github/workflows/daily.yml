name: NewsQoder Daily

on:
  schedule:
    - cron: '1 10 * * *'  # 每天 UTC 10:01 = 北京时间 18:01
  workflow_dispatch:  # 支持手动触发

jobs:
  collect-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate required secrets
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
        FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
        FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
      run: |
        missing=()
        [ -n "$FEISHU_WEBHOOK" ] || missing+=("FEISHU_WEBHOOK")
        [ -n "$FEISHU_APP_ID" ] || missing+=("FEISHU_APP_ID")
        [ -n "$FEISHU_APP_SECRET" ] || missing+=("FEISHU_APP_SECRET")
        [ -n "$FEISHU_BITABLE_TABLE_ID" ] || missing+=("FEISHU_BITABLE_TABLE_ID")

        if [ -z "$FEISHU_BITABLE_APP_TOKEN" ] && [ -z "$FEISHU_WIKI_NODE_TOKEN" ]; then
          missing+=("FEISHU_BITABLE_APP_TOKEN or FEISHU_WIKI_NODE_TOKEN")
        fi

        if [ ${#missing[@]} -gt 0 ]; then
          printf 'Missing required secrets:\n'
          printf ' - %s\n' "${missing[@]}"
          exit 1
        fi
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run daily collection
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
        FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
        FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
      run: |
        python main.py
        
    - name: Debug Python env
      run: |
        python --version
        python -c "import sys; print(sys.executable); print(sys.path)"
        ls -la scripts/
        head -5 scripts/generate_web_data.py
        
    - name: Generate web data
      env:
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
        FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
        FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
      run: |
        python scripts/generate_web_data.py
        
    - name: Commit and push
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json generate.log error.log 2>/dev/null || true
        git diff --staged --quiet || (git commit -m "Update daily data" && git push)
